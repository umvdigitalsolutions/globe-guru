<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#FFDEE9"/>
      <stop offset="1" stop-color="#B5FFFC"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- Stylized temple -->
  <g transform="translate(120,180) scale(1.1)">
    <rect x="160" y="80" width="360" height="18" rx="6" fill="#7C3AED" opacity="0.95"/>
    <rect x="140" y="98" width="400" height="12" rx="6" fill="#6D28D9" opacity="0.95"/>
    <path d="M100 110 L380 40 L660 110 L660 150 L100 150 Z" fill="#4C1D95" opacity="0.95"/>
    <rect x="220" y="150" width="40" height="120" fill="#2D1B55"/>
    <rect x="320" y="150" width="40" height="120" fill="#2D1B55"/>
    <rect x="420" y="150" width="40" height="120" fill="#2D1B55"/>
  </g>

  <!-- Hills and trees -->
  <g fill="#0F766E" opacity="0.9">
    <ellipse cx="220" cy="360" rx="260" ry="60"/>
    <ellipse cx="620" cy="360" rx="200" ry="50"/>
  </g>

  <!-- Cherry blossoms -->
  <g fill="#FFD1DC" opacity="0.95">
    <circle cx="560" cy="120" r="10"/>
    <circle cx="590" cy="140" r="8"/>
    <circle cx="520" cy="150" r="7"/>
    <circle cx="480" cy="120" r="6"/>
  </g>

  <!-- Title overlay -->
  <rect x="0" y="0" width="100%" height="56" fill="#ffffff" opacity="0.06" />
  <text x="28" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#062F2F">Kyoto — Ancient temples & seasonal beauty</text>
</svg>
